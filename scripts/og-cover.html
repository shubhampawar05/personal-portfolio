<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    * { margin: 0; box-sizing: border-box; }
    body {
      width: 1200px;
      height: 630px;
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #06080f 0%, #0f172a 45%, #1e3a5f 100%);
      color: #f8fafc;
      display: flex;
      align-items: center;
      padding: 64px 80px;
      gap: 56px;
      overflow: hidden;
    }
    .glow {
      position: absolute;
      width: 500px;
      height: 500px;
      right: -80px;
      top: -120px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.35) 0%, transparent 70%);
      pointer-events: none;
    }
    .photo {
      width: 220px;
      height: 220px;
      border-radius: 24px;
      object-fit: cover;
      border: 3px solid rgba(96, 165, 250, 0.5);
      box-shadow: 0 24px 48px rgba(0, 0, 0, 0.45);
      flex-shrink: 0;
      position: relative;
      z-index: 1;
    }
    .copy { position: relative; z-index: 1; max-width: 720px; }
    h1 {
      font-size: 52px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 12px;
    }
    .title {
      font-size: 28px;
      color: #60a5fa;
      font-weight: 600;
      margin-bottom: 20px;
    }
    p {
      font-size: 22px;
      line-height: 1.45;
      color: #cbd5e1;
    }
  </style>
</head>
<body>
  <div class="glow" aria-hidden="true"></div>
  <img class="photo" src="../public/Profile.png" alt="" />
  <div class="copy">
    <h1>Shubham Chopde</h1>
    <div class="title">Software Engineer</div>
    <p>Scalable web apps, enterprise platforms, and AI-powered products.</p>
  </div>
</body>
</html>
